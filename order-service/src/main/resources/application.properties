spring.application.name=order-service
spring.config.import=optional:configserver:http://localhost:8086

server.port=8083
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.payment-service.register-health-indicator=true
# A 4xx means the request itself is wrong, such as a bad JWT_SECRET, so it mustn't open the circuit for every order.
resilience4j.circuitbreaker.instances.payment-service.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
# Covers every payment try: 3 tries x (1s connect + 2.5s read) + at most 0.9s of waits is about 11.4s. The waits
# are 200ms +/- 100ms and 400ms +/- 200ms, because Spring scales the jitter by the multiplier.
resilience4j.timelimiter.instances.payment-service.timeout-duration=12s

order.http.connect-timeout=1s
order.http.read-timeout=2500ms
order.payment-retry.max-retries=2
order.payment-retry.delay=200ms
order.payment-retry.jitter=100ms
order.idempotency-key-ttl=PT24H
